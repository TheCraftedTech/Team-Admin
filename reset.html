<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Reset</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030307">
  <meta name="robots" content="noindex">
  <style>
    html, body { height: 100%; margin: 0; background: #030307; color: #00ff66; font-family: "Courier New", monospace; }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    a { color: #00f0ff; }
  </style>
  <script>
    // Sofort beim Aufruf: gesamten localStorage leeren und zurück zum Start
    try { localStorage.clear(); } catch (e) { /* privater Modus */ }
    try { sessionStorage.clear(); } catch (e) { /* ignorieren */ }
    location.replace("index.html");
  </script>
</head>
<body>
  <p>FORTSCHRITT GELÖSCHT.<br><a href="index.html">Weiter zur Rallye</a></p>
</body>
</html>
