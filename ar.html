<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Meine WebAR-Demo</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      padding: 20px;
      text-align: center;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      min-height: 400px;
      background: #e8e8e8;
    }

    p {
      padding: 0 16px;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>Meine AR-Anwendung</h1>
    <p>Betrachte das Modell und platziere es in deiner Umgebung.</p>
  </header>

  <model-viewer
    id="model"
    src="https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb"
    alt="Animiertes 3D-Robotermodell"
    camera-controls
    auto-rotate
    autoplay
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto">

    <button slot="ar-button">
      In meiner Umgebung anzeigen
    </button>

  </model-viewer>

  <p>
    Tipp: Tippe auf die AR-Schaltfläche und folge den
    Anweisungen deines Smartphones.
  </p>
</body>
</html>
