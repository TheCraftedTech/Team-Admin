<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Schnitzeljagd</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#030307">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schnitzeljagd">

  <style>
    :root {
      --bg: #030307;
      --green: #00ff66;
      --cyan: #00f0ff;
      --red: #ff3b5c;
      --muted: #4f7a68;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);
      user-select: none;
      -webkit-user-select: none;
    }
    /* feine Scanlines */
    body::after {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
      z-index: 50;
    }

    #view { height: 100%; display: flex; flex-direction: column; }

    button {
      font: inherit; cursor: pointer; color: var(--green);
      background: rgba(0, 255, 102, 0.10);
      border: 1px solid var(--green); border-radius: 10px;
      padding: 15px 14px; width: 100%;
      font-size: 15px; font-weight: bold; letter-spacing: 2px;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; }
    .go { background: rgba(0, 255, 102, 0.2); box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); animation: breathe 2s ease-in-out infinite; }
    @keyframes breathe { 50% { box-shadow: 0 0 34px rgba(0, 255, 102, 0.7); } }
    @keyframes blink { 50% { opacity: 0.2; } }

    /* ---------- Modul „locate“ (Radar) ---------- */
    .stage { flex: 1; min-height: 0; }
    .stage canvas { display: block; width: 100%; height: 100%; }
    .bottom { text-align: center; padding-top: 6px; }
    .dist {
      font-size: clamp(22px, 7.5vw, 34px);
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.65);
      font-variant-numeric: tabular-nums;
    }
    .note { margin-top: 6px; min-height: 1.3em; font-size: 12px; letter-spacing: 1px; color: var(--muted); }
    .note.err { color: var(--red); }
    .dots { display: flex; justify-content: center; gap: 8px; margin: 8px 0 10px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--green); opacity: 0.45; }
    .dots i.done { background: var(--green); opacity: 1; }
    .dots i.now { border-color: var(--cyan); opacity: 1; animation: blink 1s steps(2) infinite; }

    /* ---------- Seiten (Module „info“, „password“, „end“) ---------- */
    .scroller { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; }
    .page { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 28px); display: flex; flex-direction: column; gap: 22px; }

    /* ---------- Markdown-Inhalte (content/*.md) ---------- */
    .md { color: #cfe9dd; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; gap: 16px; }
    .md.loading { color: var(--muted); letter-spacing: 2px; }
    .md.error { color: var(--red); }
    .md h1 { font-size: 22px; letter-spacing: 2px; color: var(--green); text-shadow: 0 0 12px rgba(0, 255, 102, 0.6); }
    .md h2 { font-size: 18px; letter-spacing: 1px; color: var(--cyan); }
    .md h3, .md h4 { font-size: 15px; color: var(--cyan); }
    .md strong { color: #fff; }
    .md em { color: var(--cyan); font-style: italic; }
    .md a { color: var(--cyan); }
    .md img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--green); }
    .md ul, .md ol { padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
    .md blockquote { padding: 10px 14px; border-left: 3px solid var(--cyan); background: rgba(0, 240, 255, 0.06); }
    .md code { font-family: inherit; background: rgba(0, 255, 102, 0.1); padding: 1px 5px; border-radius: 4px; }
    .md pre { overflow-x: auto; padding: 10px; border: 1px solid var(--muted); border-radius: 8px; }
    .md hr { border: 0; border-top: 1px solid var(--muted); }

    /* ---------- Modul „password“ ---------- */
    form { display: flex; flex-direction: column; gap: 12px; }
    .field {
      width: 100%; font: inherit; font-size: 18px; letter-spacing: 2px; text-align: center;
      color: var(--green); background: #07100c; caret-color: var(--green);
      border: 1px solid var(--green); border-radius: 10px; padding: 15px 12px; outline: none;
    }
    .field:focus { box-shadow: 0 0 18px rgba(0, 255, 102, 0.45); }
    .field::placeholder { color: var(--muted); }
    .feedback { min-height: 1.4em; text-align: center; font-size: 13px; letter-spacing: 1px; color: var(--muted); }
    .feedback.err { color: var(--red); }
    .feedback.ok { color: var(--green); }
    .shake { animation: shake 0.4s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    /* ---------- Modul „memory“ (Aufgabe) ---------- */
    /* Die Seite füllt den ganzen Bildschirm, nichts scrollt; das Raster wird per Skript so groß wie möglich */
    .mem-screen {
      position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow: hidden;
      display: flex; flex-direction: column; gap: 10px;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 14px);
    }
    .mem-top { display: flex; align-items: center; gap: 12px; }
    .mem-title { flex: 1; text-align: center; font-size: 14px; letter-spacing: 3px; color: var(--cyan); }
    .mem-top .back { width: auto; padding: 9px 12px; font-size: 12px; letter-spacing: 1px; color: var(--muted); border-color: #25463a; background: transparent; }
    .mem-screen .dots { margin: 0; }
    .mem-screen .feedback { min-height: 1.4em; }
    .mem-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .mem-grid {
      display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); grid-template-rows: repeat(var(--n, 5), 1fr);
      gap: 10px; padding: 14px; border: 1px solid var(--green); border-radius: 12px; background: rgba(0, 28, 14, 0.5);
    }
    .mem-cell {
      width: 100%; height: 100%; padding: 0; border-radius: 50%;
      border: 2px solid rgba(0, 240, 255, 0.4); background: rgba(0, 240, 255, 0.05);
      transition: background 0.12s, box-shadow 0.12s, border-color 0.12s;
    }
    .mem-cell:disabled { opacity: 1; cursor: default; }
    .mem-cell.lit { background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 20px var(--cyan); }
    .mem-cell.ok { background: var(--green); border-color: var(--green); box-shadow: 0 0 16px var(--green); }
    .mem-cell.bad { background: var(--red); border-color: var(--red); box-shadow: 0 0 16px var(--red); }
    .mem-cell.miss { border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

    /* ---------- Modul „end“ ---------- */
    .end .page { text-align: center; min-height: 100%; justify-content: center; }
    .end .md h1 { font-size: clamp(28px, 9vw, 44px); letter-spacing: 5px; animation: glow 2s ease-in-out infinite alternate; }
    .end .md strong { color: var(--cyan); letter-spacing: 3px; font-size: 13px; }
    @keyframes glow { to { text-shadow: 0 0 22px var(--green), 0 0 44px var(--cyan); } }
  </style>
</head>
<body>
  <div id="view"></div>

  <script src="steps.js"></script>
  <script src="markdown.js"></script>
  <script src="core.js"></script>
  <script src="modules.js"></script>
  <script>startApp();</script>
</body>
</html>
